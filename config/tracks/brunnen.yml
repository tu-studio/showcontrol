id: brunnen
short_title: Brunnen der Sonne
title_de: Der Brunnen der Sonne
title_en: The Well of the Sun
artist: Christof Vonderau
audio_index: 2
video_index: 1
duration:
  minutes: 16
  seconds: 14
description: |
  Fadenfiguren begleiteten in Kiribati die Erzählung vom Entstehen der Welt, den Aufbruch zur See, die Gedichte der Verliebten, die Betrachtung des Sonnenunterganges, den zeremoniellen Weg ins Jenseits, Erzählungen vom Reich des Meeres, der Gestirne, die spielerische Sicht auf die Natur. Am Strand aufgeführt begleiteten sie zugleich die Ankunft der ersten Europäer.
  Können Fadenfiguren den Zusammenhalt der Welt heute noch fassen? Gibt es durch die Vielfalt der Begegnung und den Klimawandel mehr Nähe oder mehr Entfernung zwischen den Inseln Kiribatis und den Industriemetropolen.
  Mit dieser Frage habe ich mich in der Komposition Der Brunnen der Sonne beschäftigt und Texte aus dem Archiv von Gerd Koch (1963/64), von Sir Arthur Grimble (1951), Captain Charles Wilkes (1845) und aus dem U.S. Atoll Report (1960) für Tenor, Bariton und Konzertgitarre vertont.
description_en: |
  In Kiribati, string figures accompanied the story of the creation of the world, the departure for the sea, the poems of lovers, the contemplation of the sunset, the ceremonial path to the afterlife, tales of the realm of the sea, the stars, the playful view of nature. Performed on the beach, they also accompanied the arrival of the first Europeans.
  Can string figures still grasp the cohesion of the world today? Is there more closeness or more distance between the islands of Kiribati and the industrial metropolises due to the diversity of encounter and climate change.
  I dealt with this question in the composition The Well of the Sun and set texts from the archives of Gerd Koch (1963/64), from Sir Arthur Grimble (1951), Captain Charles Wilkes (1845) and from the U.S. Atoll Report (1960) to music for tenor, baritone and concert guitar.