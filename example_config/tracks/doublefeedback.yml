description: |
  Das Stück „Triple Feedback“ richtet die Aufmerksamkeit auf das gegenseitige Zuhören und die Macht der Aufnahme. Aus ungleichen Begegnungen entstanden Anfang des 20. Jahrhunderts bei kolonialen Expeditionen deutscher Ethnolog*innen in Ruanda Tondokumente, die im Berliner Phonogramm-Archiv lagern und den Menschen vor Ort lange Zeit nicht zugänglich waren.
  Die Künstler*innengruppe Sounding Situations untersucht in „Triple Feedback“, wie durch den Dialog und neue, eigene Aufnahmen Machtstrukturen transformiert werden können.
  Heutige ruandische Songwriter, Sänger*innen, Musik-Produzent*innen hören den ihnen bisher nicht zugänglichen Aufnahmen zu und schicken ihre Analysen, Kommentare, Fachwissen aber auch Ärger und Wut nach Deutschland zurück.
  Die Gruppe Sounding Situations hat in ihrer Komposition die alten originalen Aufnahmen in ihre heutige musikalische Sprache überführt, die in den Austausch mit den Visionen und Samples von gegenwärtigen ruandischen Musiker*innen tritt.
description_en: |
  The piece Triple Feedback draws attention to mutual listening and the power of recording. During colonial expeditions of German anthropologists in Rwanda at the beginning of the 20th century, unequal encounters resulted in sound documents that are stored today in the Berliner Phonogramm-Archiv and were not accessible to the local people for a long time.
  In Triple Feedback, the artists’ group Sounding Situations investigates how power structures can be transformed through dialogue and new, original recordings.
  Contemporary Rwandan songwriters, singers and music producers listen to the recordings that were previously inaccessible to them and send their analyses, comments, expertise, but also anger and rage back to Germany.
  In their composition, the group Sounding Situations has transferred the old original recordings into their present musical language, which enters into an exchange with the visions and samples of contemporary Rwandan musicians.
