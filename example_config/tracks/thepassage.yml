id: thepassage
title_de: The Passage
title_en: The Passage
artist: Mehmet Can Özer
audio_index: 9
video_index: 7
duration:
  minutes: 19
  seconds: 56
description: |
  Dieses Stück konzentriert sich auf die ältesten Archivaufnahmen des Berliner Phonogramm-Archivs, sie sind heute im Humboldt-Forum untergebracht. Solche historischen Tonaufnahmen bieten verschiedene Bedeutungsebenen, vor allem den Inhalt. Die Klangwelt dieser Epoche kann man nur mit Hilfe von Wachszylindern hören. Ich persönlich finde es so emotional – die Sterblichkeit des Menschen und die Unsterblichkeit der Dokumentation ringen miteinander. The Passage beleuchtet das memento mori, das von Anfang an die Inspiration war, und kommentiert auch die architektonische Funktion des Hörraums.
  Die Tonwiedergabe vom allerersten Beispiel bis zur aktuellen Situation ist die Passage in dieser Komposition. Die Aufnahmetechnologien haben die elektroakustische Musik möglich gemacht, so dass es für mich ein natürliches Kontinuum in Bezug auf das Klangmaterial war. Durch die Verwendung des fortschrittlichen, in den Hörraum eingebetteten immersiven Audiosystems lädt „The Passage“ das Publikum ein, die Rollen von Vergangenheit und Dauer zu tauschen.
  
description_en: |
  This piece is focusing on the oldest archival recordings of the Berliner Phonogramm-Archiv nowadays hosted in Humboldt-Forum. Such historical recordings offer different layers in meaning, first of all its content. Soundscape of that era can be only heard by the means of wax cylinders. Personally, I find it so emotional – the mortality of mankind and immortality of documentation are struggling. The Passage is shading light on memento mori, which was the inspiration from the beginning, also annotates the architectural function of the listening space.
  Sound reproduction from the very first example till the current situation is the passage in this composition. The recording technologies have made the electroacoustic music possible, so it was a natural continuum to me in terms of sonic material. Using the advanced immersive audio embedded in the listening space, The Passage is inviting the audience to change the roles of being past to lasting.